syntax = "proto3";

package objectfs.v1alpha1;

option go_package = "github.com/gke-labs/in-cluster-storage/pkg/api/objectfs/v1alpha1";

import "google/protobuf/timestamp.proto";

service ObjectFSController {
  rpc GetAttr(GetAttrRequest) returns (GetAttrResponse);
  rpc SetAttr(SetAttrRequest) returns (SetAttrResponse);
  rpc Lookup(LookupRequest) returns (LookupResponse);
  rpc ReadDir(ReadDirRequest) returns (ReadDirResponse);
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc TruncateFile(TruncateFileRequest) returns (TruncateFileResponse);
  rpc PunchHole(PunchHoleRequest) returns (PunchHoleResponse);
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse);
  rpc Rmdir(RmdirRequest) returns (RmdirResponse);
  rpc Rename(RenameRequest) returns (RenameResponse);
  rpc Fsync(FsyncRequest) returns (FsyncResponse);
  rpc WatchVolume(WatchVolumeRequest) returns (stream WatchVolumeResponse);
  rpc Symlink(SymlinkRequest) returns (SymlinkResponse);
  rpc Readlink(ReadlinkRequest) returns (ReadlinkResponse);
  rpc Link(LinkRequest) returns (LinkResponse);
  rpc Open(OpenRequest) returns (OpenResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);

  rpc ListBlobs(ListBlobsRequest) returns (ListBlobsResponse);
  rpc GetBlob(GetBlobRequest) returns (stream GetBlobResponse);
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc GetVolumeStats(GetVolumeStatsRequest) returns (GetVolumeStatsResponse);
  // Checkpoint requests an immediate checkpoint commit on an exclusive-local volume and waits
  // for the mounting node daemon to acknowledge it. Only exclusive-local mounts act on the event;
  // FUSE mounts ignore it.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
  // AckCheckpoint acknowledges completion of an explicit checkpoint by a node daemon.
  rpc AckCheckpoint(AckCheckpointRequest) returns (AckCheckpointResponse);
  // AcquireExclusive acquires an exclusive-local hold for a volume on a specific node and mount.
  rpc AcquireExclusive(AcquireExclusiveRequest) returns (AcquireExclusiveResponse);
  // RenewExclusive renews an active exclusive-local hold for a volume, extending its lease.
  rpc RenewExclusive(RenewExclusiveRequest) returns (RenewExclusiveResponse);
  // ReleaseExclusive releases an exclusive-local hold after final checkpoint completion.
  rpc ReleaseExclusive(ReleaseExclusiveRequest) returns (ReleaseExclusiveResponse);
  // GetExclusiveHold returns the current exclusive hold status for a volume.
  rpc GetExclusiveHold(GetExclusiveHoldRequest) returns (GetExclusiveHoldResponse);
  // RepairVolume repairs a degraded volume by moving its local segment directory aside
  // and reopening its stream to resume from the buffer witness watermark.
  rpc RepairVolume(RepairVolumeRequest) returns (RepairVolumeResponse);
}

enum WriteMode {
  WRITE_MODE_UNSPECIFIED = 0;
  WRITE_THROUGH_FSYNC = 1;
  LAZY_WRITE = 2;
  EAGER_REPLICATION = 3;
}

message EntryAttr {
  Inode inode = 1;
  string name = 2;
  string redirect_url = 3;
  uint64 stream_position = 4;
}

message GetAttrRequest {
  string volume_id = 1;
  uint64 inode = 2;
}

message GetAttrResponse {
  EntryAttr attr = 1;
  int32 error = 2;
}

message SetAttrRequest {
  string volume_id = 1;
  uint64 inode = 2;
  optional uint32 mode = 3;
  optional uint32 uid = 4;
  optional uint32 gid = 5;
  optional int64 size = 6;
  google.protobuf.Timestamp atime = 7;
  bool atime_now = 8;
  google.protobuf.Timestamp mtime = 9;
  bool mtime_now = 10;
  google.protobuf.Timestamp ctime = 11;
  bool ctime_now = 12;
}

message SetAttrResponse {
  EntryAttr attr = 1;
  int32 error = 2;
}

message LookupRequest {
  string volume_id = 1;
  uint64 parent_inode = 2;
  string name = 3;
}

message LookupResponse {
  EntryAttr attr = 1;
  int32 error = 2;
}

message ReadDirRequest {
  string volume_id = 1;
  uint64 inode = 2;
}

message ReadDirResponse {
  repeated EntryAttr entries = 1;
  int32 error = 2;
}

message MkdirRequest {
  string volume_id = 1;
  uint64 parent_inode = 2;
  string name = 3;
  uint32 mode = 4;
  uint32 uid = 5;
  uint32 gid = 6;
}

message MkdirResponse {
  EntryAttr attr = 1;
  int32 error = 2;
  uint64 stream_position = 3;
}

message CreateFileRequest {
  string volume_id = 1;
  uint64 parent_inode = 2;
  string name = 3;
  uint32 mode = 4;
  bytes initial_content = 5;
  uint32 uid = 6;
  uint32 gid = 7;
  uint32 rdev = 8;
}

message CreateFileResponse {
  EntryAttr attr = 1;
  int32 error = 2;
  uint64 fh = 3;
  uint64 stream_position = 4;
}

message ReadFileRequest {
  string volume_id = 1;
  uint64 inode = 2;
  int64 offset = 3;
  int64 size = 4;
}

message ReadFileResponse {
  bytes data = 1;
  string redirect_url = 2;
  bool eof = 3;
  int64 total_size = 4;
  int32 error = 5;
}

message WriteFileRequest {
  string volume_id = 1;
  uint64 inode = 2;
  int64 offset = 3;
  bytes data = 4;
  WriteMode write_mode = 5;
}

message WriteFileResponse {
  int64 bytes_written = 1;
  int64 new_size = 2;
  google.protobuf.Timestamp mod_time = 3;
  int32 error = 4;
  int64 staging_epoch = 5;
  uint64 stream_position = 6;
}

message TruncateFileRequest {
  string volume_id = 1;
  uint64 inode = 2;
  int64 size = 3;
}

message TruncateFileResponse {
  EntryAttr attr = 1;
  int32 error = 2;
  uint64 stream_position = 3;
}

message PunchHoleRequest {
  string volume_id = 1;
  uint64 inode = 2;
  int64 offset = 3;
  int64 length = 4;
  bool keep_size = 5;
}

message PunchHoleResponse {
  EntryAttr attr = 1;
  int32 error = 2;
  uint64 stream_position = 3;
}

message UnlinkRequest {
  string volume_id = 1;
  uint64 parent_inode = 2;
  string name = 3;
}

message UnlinkResponse {
  bool success = 1;
  int32 error = 2;
  uint64 stream_position = 3;
}

message RmdirRequest {
  string volume_id = 1;
  uint64 parent_inode = 2;
  string name = 3;
}

message RmdirResponse {
  bool success = 1;
  int32 error = 2;
  uint64 stream_position = 3;
}

message RenameRequest {
  string volume_id = 1;
  uint64 old_parent_inode = 2;
  string old_name = 3;
  uint64 new_parent_inode = 4;
  string new_name = 5;
}

message RenameResponse {
  EntryAttr attr = 1;
  int32 error = 2;
  uint64 stream_position = 3;
}

message FsyncRequest {
  string volume_id = 1;
  uint64 inode = 2;
  bool blocking = 3;
  int64 staging_epoch = 4;

  enum SyncTrigger {
    // UNSPECIFIED is what an explicit, blocking fsync carries.
    SYNC_TRIGGER_UNSPECIFIED = 0;
    SYNC_TRIGGER_PERIODIC = 1;
    SYNC_TRIGGER_CLOSE = 2;
  }
  SyncTrigger trigger = 5;
}

message FsyncResponse {
  bool success = 1;
  int32 error = 2;
  int64 staging_epoch = 3;
  uint64 stream_position = 4;
}

message WatchVolumeRequest {
  string volume_id = 1;
  string node_id = 2;
}

enum WatchEventType {
  EVENT_UNKNOWN = 0;
  EVENT_CREATED = 1;
  EVENT_MODIFIED = 2;
  EVENT_DELETED = 3;
  EVENT_RENAMED = 4;
  EVENT_CHECKPOINT_REQUEST = 5;
}

message WatchVolumeResponse {
  WatchEventType event_type = 1;
  EntryAttr attr = 2;
  uint64 inode = 3;
  uint64 parent_inode = 4;
  string name = 5;
  uint64 old_parent_inode = 6;
  string old_name = 7;
  uint64 stream_position = 8;
  string checkpoint_request_id = 9;
}

message SymlinkRequest {
  string volume_id = 1;
  uint64 parent_inode = 2;
  string name = 3;
  string target = 4;
  uint32 uid = 5;
  uint32 gid = 6;
}

message SymlinkResponse {
  EntryAttr attr = 1;
  int32 error = 2;
  uint64 stream_position = 3;
}

message ReadlinkRequest {
  string volume_id = 1;
  uint64 inode = 2;
}

message ReadlinkResponse {
  string target = 1;
  int32 error = 2;
}

message LinkRequest {
  string volume_id = 1;
  uint64 old_inode = 2;
  uint64 new_parent_inode = 3;
  string new_name = 4;
}

message LinkResponse {
  EntryAttr attr = 1;
  int32 error = 2;
  uint64 stream_position = 3;
}

message OpenRequest {
  string volume_id = 1;
  uint64 inode = 2;
  uint32 flags = 3;
}

message OpenResponse {
  uint64 fh = 1;
  int32 error = 2;
}

message ReleaseRequest {
  string volume_id = 1;
  uint64 inode = 2;
  uint64 fh = 3;
}

message ReleaseResponse {
  int32 error = 1;
}

message ListBlobsRequest {
  string from_sha = 1;
  int32 limit = 2;
  string sha_prefix = 3;
}

message ListBlobsResponse {
  repeated string sha256 = 1;
  bool end_of_data = 2;
}

message GetBlobRequest {
  string sha256 = 1;
  int64 offset = 2;
  int64 limit = 3;
}

message GetBlobResponse {
  bytes data = 1;
}

message GetManifestRequest {
  string volume_id = 1;
  uint64 inode = 2;
}

message GetManifestResponse {
  uint64 inode = 1;
  uint32 chunk_size = 2;
  int64 total_size = 3;
  repeated string chunk_sha256 = 4;
  bytes inline_data = 5;
  int32 error = 6;
}

message ListVolumesRequest {
  int32 limit = 1;
  string from_volume_id = 2;
}

message Degraded {
  enum Code {
    DEGRADED_CODE_UNSPECIFIED = 0;
    WAL_STREAM_DEGRADED = 1;
  }

  Code code = 1;
  string message = 2;
  google.protobuf.Timestamp since = 3;
}

message VolumeInfo {
  reserved 2;
  reserved "degraded_reason";

  string volume_id = 1;
  Degraded degraded = 3;
}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
  bool end_of_data = 2;
}

message SnapshotInfo {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  int64 size = 3;
  uint64 position = 4;
}

message ListSnapshotsRequest {
  string volume_id = 1;
  google.protobuf.Timestamp from_time = 2;
  google.protobuf.Timestamp to_time = 3;
  int32 limit = 4;
  string from_snapshot = 5;
}

message ListSnapshotsResponse {
  repeated SnapshotInfo snapshots = 1;
  bool end_of_data = 2;
}

message CreateSnapshotRequest {
  string volume_id = 1;
  string name = 2;
}

message CreateSnapshotResponse {
  string snapshot_name = 1;
  SnapshotInfo snapshot = 2;
}

message GetVolumeStatsRequest {
  string volume_id = 1;
}

message VolumeStats {
  string name = 1;
  uint64 max_ino = 2;
  int64 inodes_file = 3;
  int64 inodes_dir = 4;
  int64 inodes_symlink = 5;
  int64 inodes_other = 6;
  int64 logical_bytes = 7;
  int64 file_chunks = 8;
}

message GetVolumeStatsResponse {
  reserved 9;
  reserved "degraded_reason";

  VolumeStats stats = 1;
  int64 total_bytes = 2;
  int64 used_bytes = 3;
  int64 available_bytes = 4;
  int64 total_inodes = 5;
  int64 used_inodes = 6;
  int64 free_inodes = 7;
  int32 error = 8;
  Degraded degraded = 10;
}

message CheckpointRequest {
  string volume_id = 1;
}

message CheckpointResponse {
  uint64 stream_position = 1;
  int32 error = 2;
}

message AckCheckpointRequest {
  string volume_id = 1;
  string request_id = 2;
  uint64 stream_position = 3;
}

message AckCheckpointResponse {
  int32 error = 1;
}

message ExclusiveHold {
  string volume_id = 1;
  string node_id = 2;
  string mount_id = 3;
  google.protobuf.Timestamp acquired_at = 4;
  google.protobuf.Timestamp lease_expiry = 5;
}

message AcquireExclusiveRequest {
  string volume_id = 1;
  string node_id = 2;
  string mount_id = 3;
}

message AcquireExclusiveResponse {
  ExclusiveHold hold = 1;
}

message RenewExclusiveRequest {
  string volume_id = 1;
  string node_id = 2;
  string mount_id = 3;
}

message RenewExclusiveResponse {
  ExclusiveHold hold = 1;
}

message ReleaseExclusiveRequest {
  string volume_id = 1;
  string node_id = 2;
  string mount_id = 3;
}

message ReleaseExclusiveResponse {
}

message GetExclusiveHoldRequest {
  string volume_id = 1;
}

message GetExclusiveHoldResponse {
  ExclusiveHold hold = 1;
}

message Inode {
  optional uint64 ino = 1;
  uint32 mode = 2;
  int64 size = 3;
  google.protobuf.Timestamp mtime = 4;
  bool is_dir = 5;
  string sha256 = 6;
  string etag = 7;
  string manifest_sha256 = 8;
  string content_sha256 = 9;
  uint32 chunk_size = 10;
  uint32 uid = 11;
  uint32 gid = 12;
  google.protobuf.Timestamp atime = 13;
  google.protobuf.Timestamp ctime = 14;
  uint32 nlink = 15;
  string symlink_target = 16;
  uint32 rdev = 17;
  optional uint64 parent_ino = 18;
}

message DirEntry {
  optional uint64 parent_ino = 1;
  optional string name = 2;
  uint64 ino = 3;
  bool is_dir = 4;
  uint32 mode = 5;
}

message Content {
  optional string sha256 = 1;
  bytes data = 2;
}

message FileChunk {
  optional uint64 ino = 1;
  optional uint32 index = 2;
  string sha256 = 3;
  bytes inline_data = 4;
}

message RepairVolumeRequest {
  string volume_id = 1;
  bool force = 2;
}

message RepairVolumeResponse {
  string old_path = 1;
  uint64 new_watermark = 2;
}


