syntax = "proto3";

package sds.v1;

option go_package = "github.com/gke-labs/in-cluster-storage/pkg/api/sds/v1;v1";

import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";

message TypeDefinition {
  uint32 id = 1;
  string name = 2;
  bytes fingerprint = 3;
  google.protobuf.FileDescriptorSet descriptors = 4;
  repeated int32 key_fields = 5;
}

message OpRecord {
  enum Op {
    CREATE = 0;
    UPDATE = 1;
    DELETE = 2;
  }
  Op     op = 1;
  uint32 type_id = 2;
  uint64 tx_id = 3; // 0 = autocommit
  bytes  key = 4;
  bytes  value = 5;
}

message TxCommit {
  uint64 tx_id = 1;
  google.protobuf.Timestamp commit_time = 2;
}

message SnapshotPointer {
  uint64 position = 1;
  string format = 2;
  string location = 3;
  bytes registry_fingerprint = 4;
  string name = 5;
  google.protobuf.Timestamp created_at = 6;
  string restored_from = 7;
}

message StreamHeader {
  uint32 format_version = 1;
  string creator_version = 2;
  google.protobuf.Timestamp created_at = 3;
}

message Registry {
  repeated TypeDefinition types = 1;
}
