apiVersion: v1
kind: ServiceAccount
metadata:
  name: wal-buffer
  namespace: kube-objectfs-system

---

apiVersion: v1
kind: Service
metadata:
  name: wal-buffer
  namespace: kube-objectfs-system
spec:
  clusterIP: None
  selector:
    app: wal-buffer
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc

---

apiVersion: v1
kind: Service
metadata:
  name: wal-buffer-client
  namespace: kube-objectfs-system
spec:
  selector:
    app: wal-buffer
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wal-buffer
  namespace: kube-objectfs-system
spec:
  serviceName: wal-buffer
  replicas: 1
  selector:
    matchLabels:
      app: wal-buffer
  template:
    metadata:
      labels:
        app: wal-buffer
    spec:
      serviceAccountName: wal-buffer
      containers:
        - name: wal-buffer
          image: wal-buffer:latest
          args:
            - "--v=5"
            - "--port=50051"
            - "--data-dir=/var/lib/objectfs/wal-buffer"
            - "--backend=$(OBJECT_STORAGE_BACKEND)"
          env:
            - name: OBJECT_STORAGE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: objectfs-config
                  key: backend
          ports:
            - containerPort: 50051
              name: grpc
          volumeMounts:
            - name: data-dir
              mountPath: /var/lib/objectfs/wal-buffer
      # When using hostPath storage, the wal-buffer pod must be pinned to a designated node
      # (e.g. via nodeSelector or nodeAffinity) so that the local segment store persists across
      # pod restarts. In dynamic multi-node clusters without node pinning, replace volumes with
      # volumeClaimTemplates backed by a persistent StorageClass.
      # nodeSelector:
      #   kubernetes.io/hostname: <designated-node>
      volumes:
        - name: data-dir
          hostPath:
            path: /var/lib/objectfs/wal-buffer
            type: DirectoryOrCreate

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wal-buffer-pdb
  namespace: kube-objectfs-system
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: wal-buffer
