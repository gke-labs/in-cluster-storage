apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: objectfs.labs.gke.io
spec:
  attachRequired: false
  podInfoOnMount: true
  volumeLifecycleModes:
    - Ephemeral
    - Persistent

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: objectfs-node-daemon
  namespace: kube-objectfs-system

---

kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectfs-node-daemon-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]

---

kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectfs-node-daemon-binding
subjects:
  - kind: ServiceAccount
    name: objectfs-node-daemon
    namespace: kube-objectfs-system
roleRef:
  kind: ClusterRole
  name: objectfs-node-daemon-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: objectfs-admin
  namespace: kube-objectfs-system

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: objectfs-tls-init
  namespace: kube-objectfs-system

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: objectfs-tls-init-role
  namespace: kube-objectfs-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["objectfs-tls"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: objectfs-tls-init-binding
  namespace: kube-objectfs-system
subjects:
  - kind: ServiceAccount
    name: objectfs-tls-init
    namespace: kube-objectfs-system
roleRef:
  kind: Role
  name: objectfs-tls-init-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: batch/v1
kind: Job
metadata:
  name: objectfs-tls-init
  namespace: kube-objectfs-system
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: objectfs-tls-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: objectfs-tls-init
      containers:
        - name: init-tls
          image: objectfs-controller:latest
          args:
            - "--init-tls"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: objectfs-controller
  namespace: kube-objectfs-system
spec:
  podSelector:
    matchLabels:
      app: objectfs-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: objectfs-node-daemon
        - podSelector:
            matchLabels:
              app: objectfs-admin
      ports:
        - protocol: TCP
          port: 50051

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: objectfs-node-daemon
  namespace: kube-objectfs-system
spec:
  selector:
    matchLabels:
      app: objectfs-node-daemon
  template:
    metadata:
      labels:
        app: objectfs-node-daemon
    spec:
      hostPID: true
      serviceAccountName: objectfs-node-daemon
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/objectfs.labs.gke.io/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: objectfs-node-daemon
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          image: objectfs-node-daemon:latest
          args:
            - "--v=5"
            - "--endpoint=unix:///csi/csi.sock"
            - "--nodeid=$(NODE_ID)"
            - "--controller-address=objectfs-controller:50051"
            - "--cache-dir=/var/cache/objectfs"
            - "--ca-cert-file=/etc/objectfs/tls/ca.crt"
            - "--token-file=/var/run/secrets/tokens/token"
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: "Bidirectional"
            - name: cache-dir
              mountPath: /var/cache/objectfs
            - name: objectfs-tls
              mountPath: /etc/objectfs/tls
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/objectfs.labs.gke.io/
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: cache-dir
          hostPath:
            path: /var/cache/objectfs
            type: DirectoryOrCreate
        - name: objectfs-tls
          secret:
            secretName: objectfs-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: objectfs-controller
                  expirationSeconds: 3600
                  path: token

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: objectfs-controller
  namespace: kube-objectfs-system

---

kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectfs-controller-role
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]

---

kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectfs-controller-binding
subjects:
  - kind: ServiceAccount
    name: objectfs-controller
    namespace: kube-objectfs-system
roleRef:
  kind: ClusterRole
  name: objectfs-controller-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: Service
metadata:
  name: objectfs-controller
  namespace: kube-objectfs-system
spec:
  selector:
    app: objectfs-controller
  ports:
    - port: 50051
      targetPort: 50051

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: objectfs-config
  namespace: kube-objectfs-system
data:
  backend: "" # Required: object storage backend URL (e.g. gs://my-bucket/prefix or s3://my-bucket/prefix)

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: objectfs-controller
  namespace: kube-objectfs-system
spec:
  serviceName: objectfs-controller
  replicas: 1
  selector:
    matchLabels:
      app: objectfs-controller
  template:
    metadata:
      labels:
        app: objectfs-controller
    spec:
      serviceAccountName: objectfs-controller
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--feature-gates=Topology=false"
            - "--extra-create-metadata"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: objectfs-controller
          image: objectfs-controller:latest
          args:
            - "--v=5"
            - "--port=50051"
            - "--csi-endpoint=unix:///csi/csi.sock"
            - "--backend=$(OBJECT_STORAGE_BACKEND)"
            - "--wal-dir=/var/lib/objectfs/controller/wal"
            - "--metadata-dir=/var/lib/objectfs/controller/metadata"
            - "--wal-target=wal-buffer-client:50051"
            - "--wal-durability=witness"
            - "--tls-cert-file=/etc/objectfs/tls/tls.crt"
            - "--tls-key-file=/etc/objectfs/tls/tls.key"
            - "--auth-audience=objectfs-controller"
          env:
            - name: OBJECT_STORAGE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: objectfs-config
                  key: backend
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 50051
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: data-dir
              mountPath: /var/lib/objectfs/controller
            - name: objectfs-tls
              mountPath: /etc/objectfs/tls
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: data-dir
          hostPath:
            path: /var/lib/objectfs/controller
            type: DirectoryOrCreate
        - name: objectfs-tls
          secret:
            secretName: objectfs-tls
            optional: true
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: objectfs-controller
                  expirationSeconds: 3600
                  path: token

---

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: objectfs-standard
provisioner: objectfs.labs.gke.io
volumeBindingMode: Immediate
reclaimPolicy: Delete

---

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: objectfs-exclusive-local
provisioner: objectfs.labs.gke.io
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  mode: exclusive-local
  checkpointInterval: "0s" # optional: duration string (e.g. "10s", "1m", default "0s" off)

