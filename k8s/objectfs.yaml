apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: objectfs.labs.gke.io
spec:
  attachRequired: false
  podInfoOnMount: true
  volumeLifecycleModes:
    - Ephemeral
    - Persistent

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: objectfs-node-daemon
  namespace: kube-objectfs-system

---

kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectfs-node-daemon-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]

---

kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectfs-node-daemon-binding
subjects:
  - kind: ServiceAccount
    name: objectfs-node-daemon
    namespace: kube-objectfs-system
roleRef:
  kind: ClusterRole
  name: objectfs-node-daemon-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: objectfs-admin
  namespace: kube-objectfs-system

---

